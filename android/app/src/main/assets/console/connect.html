<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/console/assets/console.css"><title>连接电脑</title>
<style>body{overflow:auto;min-height:100dvh;height:auto}main{max-width:440px;margin:auto;padding:64px 28px 32px}.logo{display:grid;place-items:center;width:48px;height:48px;background:var(--ink);color:white;border-radius:14px;font:22px var(--mono);margin-bottom:48px}h1{font-size:32px;letter-spacing:-1px;margin:0 0 12px}p{color:var(--muted);line-height:1.8}form{margin-top:36px}label{display:block;font-size:15px;margin-bottom:10px}input{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--accent);color:white;margin-top:16px;font-weight:600}.hint{font-size:14px;margin-top:32px}#error{color:var(--danger);font-size:13px}</style></head>
<body><main><div class="logo">&lt;/&gt;</div><h1>工作，随时继续。</h1><p>连接电脑上的 Codex，<br>接着聊，也接着做。</p><form id="form"><label for="address">电脑地址</label><input id="address" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="http://192.168.1.100:38457" required><div id="error" role="alert"></div><button>连接电脑 →</button></form><p class="hint">电脑与手机需要在同一网络，或通过 VPN 互通。连接后输入 Token 或配对码。</p></main><script>document.getElementById('form').onsubmit=e=>{e.preventDefault();location.href='/connect?address='+encodeURIComponent(document.getElementById('address').value.trim())}</script></body></html>
